name: CNTierTag
version: '${project.version}'
main: win.cntier.tag.CnTierTagPlugin
api-version: '1.21'
author: Larkdream
description: 在玩家头顶和 Tab 显示 CN Tierlist 段位，并提供查询命令与占位符
website: https://cntier.win
softdepend:
  - PlaceholderAPI
commands:
  cntier:
    description: 查询 CNTier 段位或管理插件缓存
    usage: /cntier [玩家|refresh|reload|clear]
    aliases:
      - ctier
permissions:
  cntier.use:
    description: 可以查询 CNTier 段位
    default: true
  cntier.admin:
    description: 可以刷新、重载和清空 CNTierTag 缓存
    default: op
