# 默认读取公开总榜，不配置 Key 也能显示玩家段位。
api:
  base-url: "https://cntier.win"
  # 可选。公开总榜请求失败或未找到玩家时，配置后会尝试单玩家接口。
  key: ""
  # 单次请求的超时时间，允许范围为 2～30 秒。
  timeout-seconds: 15
# CNTIER_API_KEY 环境变量的优先级高于 api.key。

cache:
  # 总榜由全服共享；以下数值分别控制成功、未收录和失败结果的缓存时间。
  success-seconds: 300
  not-found-seconds: 60
  failure-seconds: 20

# 直接显示不依赖 PlaceholderAPI。关闭 enabled 后仍可单独使用命令和占位符。
direct-display:
  enabled: true
  nametag: true
  tab-list: true
  # 检查缓存、显示内容和可见性的周期。默认 100 tick，即 5 秒。
  refresh-ticks: 100

# selected_only：只看 default-mode；highest_only：只看最高段位；
# mixed：default-mode 有段位就用它，没有再退回最高段位。
# default-mode 填 best 时，三种规则都会直接挑最高段位。
default-mode: "best"
display-rule: "mixed"

formats:
  # 可用变量：<tier> <tier_color> <icon> <retired> <retired_color>
  # 还有 <mode> <mode_name> <mode_icon> <mode_color>。
  # head 是头顶称号部分，插件会在其后追加灰色分隔符和白色玩家名。
  head: "<mode_color><mode_icon> <retired_color><retired><tier_color><tier>"
  # tag 用作 Tab 前缀和默认标签占位符。
  tag: "<mode_color><mode_icon> <retired_color><retired><tier_color><tier> &7| &r"
  formatted: "<mode_color><mode_icon> <retired_color><retired><tier_color><tier> &7|&r"
  tier: "<retired_color><retired><tier_color><tier>&r"
  peak: "<tier_color><tier>&r"
  loading: ""
  unranked: ""
  error: ""
  no-api-key: ""

retired:
  marker: "(R) "
  color: "#A2D6FF"
  icon: ""

